version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Bogota"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automated"
    # REGLA JULIÁN (10-ago): majors = decisión manual con investigación previa.
    # No abrir PRs de semver-major (tailwindcss 4, framer-motion 13, @types/node 26...)
    # — rompen el build (peers) o requieren migración planificada.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      medusa:
        patterns:
          - "@medusajs/*"
      react:
        patterns:
          - "react*"
          - "@types/react*"
      radix:
        patterns:
          - "@radix-ui/*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
